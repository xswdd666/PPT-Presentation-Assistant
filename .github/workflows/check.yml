name: Integration acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CHANNEL: msedge
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deck-rehearsal/web exec playwright install msedge
      - run: pnpm check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-acceptance
          path: artifacts/
          retention-days: 14
